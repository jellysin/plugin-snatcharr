name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

# The jellysin release flow (jellysin/release-helper) runs release-please with the job's
# GITHUB_TOKEN and no GitHub App. Pull requests created with that token start no workflows,
# so the called workflow dispatches ci.yml on the release branch itself (ci.yml carries
# workflow_dispatch for that). Same pattern as jellysin/plugin-lastfm.
permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: jellysin/release-helper/.github/workflows/release-please.yml@c0f6e472f9ac4da2ccdd10afd0a7a167d938b566 # v1.6.0
